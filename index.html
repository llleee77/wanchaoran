<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万超然 · 高级网页设计档案索引</title>
<meta http-equiv="refresh" content="0;url=my-page/index.html">
<style>
  :root{
    --wcr_ink:#1b2733;
    --wcr_mist:#eef1f4;
    --wcr_deep:#0f3d5e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(900px 420px at 80% -8%, #d7e5f2 0%, transparent 62%),
      var(--wcr_mist);
    color:var(--wcr_ink);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.7;
  }
  .wcr_card{
    padding:44px 52px;
    background:#fff;
    border:1px solid #dfe5ea;
    box-shadow:0 18px 40px rgba(20,32,46,.08);
    text-align:center;
  }
  .wcr_kicker{
    font-size:12px;
    letter-spacing:.24em;
    color:var(--wcr_deep);
  }
  .wcr_title{
    margin:14px 0 8px;
    font-size:30px;
    font-weight:900;
    letter-spacing:-.01em;
  }
  .wcr_note{
    font-size:14px;
    color:#64748b;
    max-width:34ch;
    margin:0 auto 26px;
  }
  .wcr_go{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 22px;
    background:var(--wcr_deep);
    color:#fff;
    font-size:14px;
    font-weight:800;
    text-decoration:none;
  }
  .wcr_go:hover{background:#163a58;}
  .wcr_meta{margin-top:22px;font-size:12px;color:#94a3b8;}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>
  <main class="wcr_card">
    <p class="wcr_kicker">CLASS PRACTICE ARCHIVE</p>
    <h1 class="wcr_title">高级网页设计档案</h1>
    <p class="wcr_note">全部课堂练习已整理至 my-page 文件夹，从下面的入口进入课堂目录。</p>
    <a class="wcr_go" href="my-page/index.html">进入课堂目录 →</a>
    <p class="wcr_meta">索引页 · 自动跳转中</p>
  </main>
</body>
</html>
