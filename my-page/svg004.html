<body>

        <symbol id="icon-love" viewBox="0 0 24 24">

    <a class="page-back" href="index.html">← 返回课堂目录</a>

    <div class="page-head">
        <p class="eyebrow">CLASS PRACTICE / 006</p>
        <h2>SVG 图标</h2>
        <p>使用 svg &lt;symbol&gt; 定义图标，通过 JavaScript 切换底部标签栏的选中状态。点击下方图标试试。</p>

        <div class="preview">
            <div class="tab-item active" onclick="changeTab(this)">
                <svg class="icon" aria-hidden="true"><use xlink:href="#icon-browser"></use></svg>
                <span>浏览器</span>
            </div>
            <div class="tab-item" onclick="changeTab(this)">
                <svg class="icon" aria-hidden="true"><use xlink:href="#icon-love"></use></svg>
                <span>关注</span>
            </div>
            <div class="tab-item" onclick="changeTab(this)">
                <svg class="icon" aria-hidden="true"><use xlink:href="#icon-positioning"></use></svg>
                <span>定位</span>
            </div>
            <div class="tab-item" onclick="changeTab(this)">
                <svg class="icon" aria-hidden="true"><use xlink:href="#icon-nav"></use></svg>
                <span>分享</span>
            </div>
        </div>
    </div>

    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-browser"></use></svg>
            <span>浏览器</span>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-love"></use></svg>
            <span>关注</span>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-positioning"></use></svg>
            <span>定位</span>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-nav"></use></svg>
            <span>分享</span>
        </div>
    </div>

    <script>
        function changeTab(current) {
            var items = current.parentNode.querySelectorAll('.tab-item')
            for (var i = 0; i < items.length; i++) {
                items[i].classList.remove('active')
            }
            current.classList.add('active')
        }
    </script>
</body>

</html>
